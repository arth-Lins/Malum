[project]
name = "malum-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.9", "pydantic-settings>=2.5", "pandas>=2.2", "numpy>=2.0", "scipy>=1.14", "openpyxl>=3.1", "xlrd>=2.0", "httpx>=0.27", "python-multipart>=0.0.12"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
